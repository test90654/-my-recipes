<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Recipe Book</title><style>body{font-family:system-ui,sans-serif;background:#f4f7f2;color:#24362a;margin:0}header{background:#28533b;color:white;padding:22px}main{max-width:850px;margin:auto;padding:18px}input,select,button{font:inherit;padding:9px;border-radius:9px;border:1px solid #bdcbbf}#search{width:95%;padding:13px}.filters{display:flex;gap:7px;margin:14px 0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card,.detail{background:white;border-radius:14px;padding:18px;margin-bottom:12px;box-shadow:0 2px 8px #0001}button{cursor:pointer;background:#28533b;color:white}li{margin:9px 0;line-height:1.7}li:has(input:checked){opacity:.5;text-decoration:line-through}blockquote{background:#eef5ed;padding:12px;border-left:3px solid #5d9167}small{color:#64796b}</style></head><body><header><h1>🍳 My Recipe Book</h1>作って、改良して、残していくレシピ帳</header><main id="app">読み込み中...</main><script src="app.js"></script></body></html>
